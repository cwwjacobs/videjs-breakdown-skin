EBVTT\n\n00:00:03.500 --> 00:00:16.380\nA signal is not a verdict. An employee account shows an unfamiliar\nsession, a new external forwarding rule, and an unusual download.\nThat is enough to investigate urgently, but not enough to name the\nroot cause.\n\n00:00:19.000 --> 00:00:30.040\nFirst, separate observations from explanations. Correlate identity\nand application logs, check what the account can access, and\nverify the activity with the employee through a trusted channel.\n\n00:00:32.660 --> 00:00:48.140\nMFA does not rule out token theft. An attacker may replay a stolen\nsession even after the real user completed multifactor\nauthentication. A legitimate VPN or approved export may also\nexplain individual signals, so test alternatives.\n\n00:00:50.760 --> 00:01:09.680\nContain, scope, then verify. If unauthorized activity is\ncorroborated, restrict the affected access under your incident\nprocess, revoke relevant sessions, and investigate forwarding\nrules, consent grants, and new authentication methods or devices.\nPreserve evidence while reducing ongoing harm.\n\n00:01:12.300 --> 00:01:24.220\nDo not promise that a password reset instantly ends every session.\nExisting access tokens or application-issued sessions may remain\nusable, depending on the application and its revocation support.\n\n00:01:26.840 --> 00:01:43.880\nFinish by checking that unauthorized access and persistence are\nremoved. State what data access is confirmed, what remains\nunknown, and what evidence supports closure. In an interview,\nexplain the decision, the tradeoff, and the verification, not just\nthe tool you would open.\n"}</script>
