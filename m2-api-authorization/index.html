ked through."}, "steps": {"type": "array", "minItems": 2, "maxItems": 6, "items": {"type": "object", "additionalProperties": false, "required": ["title", "text"], "properties": {"title": {"type": "string", "minLength": 1, "maxLength": 60}, "text": {"type": "string", "minLength": 1, "maxLength": 320}, "image": {"type": "string", "minLength": 1, "description": "Optional picture for this stage, a file in the lesson folder."}, "result": {"type": "string", "minLength": 1, "maxLength": 120, "description": "Optional outcome of this stage, shown set apart (a number, a state, a line of output)."}}}}}}}, {"name": "world", "version": "1.0.0", "entry": "blocks/world/index.js", "schema": {"title": "world block, version 1", "type": "object", "additionalProperties": false, "required": ["type", "version", "parts"], "properties": {"type": {"const": "world"}, "version": {"const": 1}, "view": {"enum": ["iso", "top", "front", "orbit"], "description": "How the world first looks. top: flat, from above (2D). iso: at an angle, so zones, levels and heights read (2.5D). front: from the side, so stacked levels read as a cross-section. orbit: a 3D view the viewer turns. iso when left out. Chapters may change it with scene.view."}, "arrange": {"enum": ["side-by-side", "levels"], "description": "side-by-side: zones sit next to each other on one ground (rooms, places, inside and outside a boundary). levels: zones are floors stacked one above the other, the first on top (layers of a system, floors of a building). side-by-side when left out."}, "zones": {"type": "array", "maxItems": 6, "description": "Areas or levels that parts sit in.", "items": {"type": "object", "additionalProperties": false, "required": ["id", "label", "detail"], "properties": {"id": {"type": "string", "pattern": "^[a-z][a-z0-9-]{0,31}$", "x-hint": "Use lowercase letters, digits and hyphens, starting with a letter."}, "label": {"type": "string", "minLength": 1, "maxLength": 28, "x-hint": "Labels are drawn on the picture, so keep them short."}, "detail": {"type": "string", "minLength": 1, "maxLength": 320, "description": "Shown in the card when the viewer selects it."}}}}, "parts": {"type": "array", "minItems": 2, "maxItems": 16, "description": "The people and things in the world, each drawn as a solid of its shape.", "items": {"type": "object", "additionalProperties": false, "required": ["id", "label", "detail"], "properties": {"id": {"type": "string", "pattern": "^[a-z][a-z0-9-]{0,31}$", "x-hint": "Use lowercase letters, digits and hyphens, starting with a letter."}, "label": {"type": "string", "minLength": 1, "maxLength": 28, "x-hint": "Labels are drawn on the picture, so keep them short."}, "detail": {"type": "string", "minLength": 1, "maxLength": 320, "description": "Shown in the card when the viewer selects it."}, "zone": {"type": "string", "pattern": "^[a-z][a-z0-9-]{0,31}$", "x-hint": "Use lowercase letters, digits and hyphens, starting with a letter.", "description": "The id of the zone it sits in. Left out, it sits on open ground."}, "shape": {"enum": ["person", "laptop", "phone", "screen", "tower", "cylinder", "cloud", "globe", "building", "document", "folder", "envelope", "box", "card", "chip", "key", "lock", "shield", "warning"], "description": "What it looks like: person; laptop, phone, screen (a monitor); tower (a tall cabinet, such as a server); cylinder (a store of records); cloud; globe (the outside world); building; document, folder, envelope, card, chip, box; key, lock, shield, warning (a sign on a stand). box when left out."}, "tone": {"enum": ["normal", "good", "bad", "warn"], "description": "bad for what is risky or hostile, good for what is safe or healthy, warn for what needs attention. normal when left out."}}}}, "connections": {"type": "array", "maxItems": 20, "description": "Lines between parts.", "items": {"type": "object", "additionalProperties": false, "required": ["from", "to"], "properties": {"from": {"type": "string", "pattern": "^[a-z][a-z0-9-]{0,31}$", " ed\nBOLA. The application knows who the user is, but failed to check\nwhether that user may read this particular object.\n\n00:00:35.889 --> 00:00:48.689\nA safe query can return a forbidden row. Parameterized SQL keeps\ndata values separate from query structure, helping prevent SQL\ninjection. It does not decide whether the caller is entitled to\nthe selected invoice.\n\n00:00:50.763 --> 00:01:07.723\nEnforce the policy on the server. Derive identity and tenant\ncontext from trusted server-side state, and check the requested\naction against the object's ownership, tenant, and applicable\naccess policy. Do not trust a client-supplied tenant identifier\nwithout validation.\n\n00:01:09.797 --> 00:01:18.157\nReplacing sequential identifiers with UUIDs does not repair a\nmissing permission check. Hiding a button does not enforce the\nbackend policy either.\n\n00:01:20.231 --> 00:01:34.511\nTest both allowed and denied access: permitted own-tenant\ninvoices, forbidden cross-tenant invoices, and restricted objects\nwithin the same tenant. Test privileged support access separately\nif that role exists.\n\n00:01:36.586 --> 00:01:44.426\nIn an interview, name the broken boundary, propose a server-side\nfix, and describe the regression test that would catch the failure\nagain.\n"}</script>
