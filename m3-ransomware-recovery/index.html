ntainment\nmethod.\n\n00:00:33.593 --> 00:00:48.593\nPower-off has an evidence tradeoff. Shutting a machine down may\ndestroy information held in memory. Prefer network isolation when\navailable. If isolation and disconnection are unavailable, power-\ndown may be necessary to limit further damage.\n\n00:00:50.340 --> 00:01:06.820\nNext, scope affected systems, identities, shared storage, and\nbackup access. Investigate whether compromise began earlier and\nwhether data was stolen. Encryption and data theft are separate\nquestions. Missing alerts do not prove that no data left.\n\n00:01:08.567 --> 00:01:26.487\nRecovery needs proof. A successful backup job is not a successful\nrestore test. Validate an appropriately protected backup in an\nisolated environment, address the entry point and persistence,\nremediate affected credentials, and verify essential business\nfunctions before reconnecting restored systems.\n\n00:01:28.233 --> 00:01:44.753\nIn an interview, distinguish containment, eradication, and\nrecovery. Explain what has been confirmed, what remains uncertain,\nand who owns the next decision. The goal is not merely to bring\nsystems back online. It is to restore trustworthy service.\n"}</script>
